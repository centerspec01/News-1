<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Manutenção Veicular</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#111827; --soft:#4b5563; --faint:#9ca3af;
  --line:#e5e7eb; --accent:#1d4ed8; --accent-ink:#fff;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#a16207; --warn-bg:#fef9c3;
  --bad:#b91c1c; --bad-bg:#fee2e2; --off:#6b7280; --off-bg:#f3f4f6;
  --plate-blue:#003399;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --card:#111827; --ink:#f3f4f6; --soft:#cbd5e1; --faint:#64748b;
    --line:#1f2937; --accent:#3b82f6; --accent-ink:#fff;
    --ok:#4ade80; --ok-bg:#052e16; --warn:#facc15; --warn-bg:#3a2e05;
    --bad:#f87171; --bad-bg:#450a0a; --off:#94a3b8; --off-bg:#1e293b;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --card:#111827; --ink:#f3f4f6; --soft:#cbd5e1; --faint:#64748b;
  --line:#1f2937; --accent:#3b82f6; --accent-ink:#fff;
  --ok:#4ade80; --ok-bg:#052e16; --warn:#facc15; --warn-bg:#3a2e05;
  --bad:#f87171; --bad-bg:#450a0a; --off:#94a3b8; --off-bg:#1e293b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:20px;margin:0;flex:1;min-width:160px}
.plate{display:inline-flex;flex-direction:column;border:2px solid #111;border-radius:6px;background:#fff;color:#111;overflow:hidden;min-width:132px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.plate .band{background:var(--plate-blue);color:#fff;font-size:9px;letter-spacing:.12em;text-align:center;padding:1px 6px;font-weight:700}
.plate .num{font:700 22px/1.1 "Arial Narrow",Arial,sans-serif;letter-spacing:.08em;text-align:center;padding:3px 8px}
.plate.sm{min-width:96px}.plate.sm .num{font-size:16px}.plate.sm .band{font-size:7px}
select.veh{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--soft)}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:0 0 8px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{font-size:12px;color:var(--soft)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.item:first-of-type{border-top:0}
.item .name{font-weight:600}
.item .meta{font-size:12.5px;color:var(--soft);grid-column:1/2}
.item .act{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-off{background:var(--off-bg);color:var(--off)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft)}
label.f input,label.f select,label.f textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 14px;max-height:340px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px}
.checks .cat{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--soft);font-weight:600;border-top:0}
td.num,th.num{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--soft);font-size:13px}
.empty{text-align:center;padding:30px 10px;color:var(--soft)}
.progress{height:6px;background:var(--off-bg);border-radius:4px;overflow:hidden;margin-top:4px;grid-column:1/2}
.progress i{display:block;height:100%}
.plan-row{display:grid;grid-template-columns:24px 1fr 110px 110px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.plan-row input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.kmbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kmbar input{width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
@media (max-width:560px){
  .plan-row{grid-template-columns:24px 1fr 80px 80px;font-size:13px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🔧 Manutenção Veicular</h1>
    <select class="veh" id="vehSel" aria-label="Veículo"></select>
  </header>
  <nav class="tabs" id="tabs">
    <button data-t="painel" class="on">Painel</button>
    <button data-t="registrar">Registrar serviço</button>
    <button data-t="historico">Histórico</button>
    <button data-t="plano">Plano de manutenção</button>
    <button data-t="veiculos">Veículos</button>
    <button data-t="dados">Backup</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== Catálogo padrão: [id, categoria, nome, intervalo km, intervalo meses] ===== */
const CATALOG = [
  // Motor
  ['oleo','Motor','Troca de óleo do motor',10000,12],
  ['filtro_oleo','Motor','Filtro de óleo',10000,12],
  ['filtro_ar','Motor','Filtro de ar do motor',15000,12],
  ['filtro_comb','Motor','Filtro de combustível',20000,24],
  ['velas','Motor','Velas de ignição',40000,36],
  ['cabos_velas','Motor','Cabos de vela / bobinas',60000,48],
  ['correia_dentada','Motor','Correia dentada + tensor',60000,48],
  ['correia_acess','Motor','Correia do alternador / acessórios',60000,48],
  ['arrefecimento','Motor','Líquido de arrefecimento (radiador)',40000,24],
  ['bicos','Motor','Limpeza de bicos injetores / TBI',40000,24],
  // Freios
  ['pastilhas_d','Freios','Pastilhas de freio dianteiras',30000,24],
  ['pastilhas_t','Freios','Pastilhas / lonas traseiras',50000,36],
  ['discos','Freios','Discos de freio',60000,48],
  ['fluido_freio','Freios','Fluido de freio (DOT)',20000,24],
  ['freio_mao','Freios','Regulagem do freio de mão',20000,12],
  // Pneus
  ['calibragem','Pneus','Calibragem dos pneus (incl. estepe)',0,1],
  ['rodizio','Pneus','Rodízio de pneus',10000,12],
  ['alinhamento','Pneus','Alinhamento e balanceamento',10000,12],
  ['pneus','Pneus','Troca de pneus',50000,60],
  ['estepe','Pneus','Estepe, macaco e chave de roda (verificar)',0,6],
  // Elétrica
  ['bateria','Elétrica','Bateria',0,36],
  ['bateria_teste','Elétrica','Teste de bateria / alternador',0,12],
  ['farois','Elétrica','Faróis, lanternas e setas',0,6],
  ['regulagem_farol','Elétrica','Regulagem dos faróis',0,24],
  ['motor_partida','Elétrica','Motor de partida (verificar)',0,24],
  ['fusiveis','Elétrica','Fusíveis e relés (verificar)',0,12],
  ['buzina','Elétrica','Buzina e painel (luzes de alerta)',0,12],
  // Vidros e visibilidade
  ['palhetas','Vidros e visibilidade','Palhetas do limpador de para-brisa',0,12],
  ['fluido_lav','Vidros e visibilidade','Fluido do lavador de para-brisa',0,3],
  ['vidros_eletricos','Vidros e visibilidade','Vidros elétricos (lubrificar canaletas)',0,12],
  ['parabrisa','Vidros e visibilidade','Para-brisa (trincas/pontos de pedra)',0,12],
  ['retrovisores','Vidros e visibilidade','Retrovisores',0,12],
  ['travas','Vidros e visibilidade','Travas elétricas e alarme',0,12],
  // Suspensão e direção
  ['amortecedores','Suspensão e direção','Amortecedores',60000,60],
  ['bandejas','Suspensão e direção','Pivôs, buchas e bandejas',30000,24],
  ['terminais','Suspensão e direção','Terminais e barra de direção',30000,24],
  ['fluido_direcao','Suspensão e direção','Fluido da direção hidráulica',40000,24],
  ['rolamentos','Suspensão e direção','Rolamentos de roda',60000,48],
  // Transmissão
  ['oleo_cambio','Transmissão','Óleo do câmbio',60000,48],
  ['embreagem','Transmissão','Embreagem (kit)',80000,0],
  ['homocineticas','Transmissão','Homocinéticas e coifas',40000,24],
  // Climatização
  ['filtro_cabine','Climatização','Filtro de cabine (ar-condicionado)',15000,12],
  ['higienizacao_ac','Climatização','Higienização do ar-condicionado',0,12],
  ['gas_ac','Climatização','Carga de gás do A/C',0,36],
  // Geral / documentos
  ['revisao','Geral e documentos','Revisão geral',10000,12],
  ['escapamento','Geral e documentos','Escapamento (verificar)',20000,24],
  ['cintos','Geral e documentos','Cintos de segurança e airbag',0,24],
  ['ipva','Geral e documentos','IPVA / Licenciamento',0,12],
  ['seguro','Geral e documentos','Seguro',0,12],
  ['lavagem','Geral e documentos','Lavagem / enceramento',0,1],
];
const CATS = [...new Set(CATALOG.map(c=>c[1]))];
const CAT_ICON = {'Motor':'⚙️','Freios':'🛑','Pneus':'🛞','Elétrica':'⚡','Vidros e visibilidade':'🪟','Suspensão e direção':'🔩','Transmissão':'🔗','Climatização':'❄️','Geral e documentos':'📋'};
const WARN_KM = 1000, WARN_DAYS = 30;

/* ===== Estado ===== */
const KEY = 'manutencao-veicular-v1';
let S = load();
let tab = 'painel';
let histFilter = '';

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.vehicles) return d; }catch(e){}
  return {vehicles:[], current:null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Não foi possível salvar no navegador'); } }
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const veh = () => S.vehicles.find(v=>v.id===S.current);
function defaultPlan(){ const p={}; CATALOG.forEach(([id,,,km,m])=>p[id]={on:true,km,m}); return p; }
function itemName(id, v){ const c = CATALOG.find(c=>c[0]===id); return c ? c[2] : (v && v.custom && v.custom[id] ? v.custom[id].name : id); }
function itemCat(id, v){ const c = CATALOG.find(c=>c[0]===id); return c ? c[1] : (v && v.custom && v.custom[id] ? v.custom[id].cat : 'Geral e documentos'); }
function allItems(v){ return [...CATALOG.map(c=>c[0]), ...Object.keys(v.custom||{})]; }

/* ===== Utilidades ===== */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKm = n => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR')+' km';
const fmtDate = s => s ? new Date(s+'T12:00:00').toLocaleDateString('pt-BR') : '—';
const fmtMoney = n => Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today = () => new Date().toISOString().slice(0,10);
function addMonths(dateStr, m){ const d=new Date(dateStr+'T12:00:00'); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
function normPlate(p){ return String(p||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7); }
function validPlate(p){ return /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(p); }
function showPlate(p){ p=normPlate(p); return /^[A-Z]{3}[0-9]{4}$/.test(p) ? p.slice(0,3)+'-'+p.slice(3) : p; }
function plateHTML(p, sm){ return `<span class="plate${sm?' sm':''}"><span class="band">BRASIL</span><span class="num">${esc(showPlate(p))}</span></span>`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ===== Cálculo de status ===== */
function lastService(v, id){
  let best=null;
  (v.services||[]).forEach(s=>{ if(s.items.includes(id)){ if(!best || s.date>best.date || (s.date===best.date && s.km>best.km)) best=s; } });
  return best;
}
function status(v, id){
  const p = v.plan[id]; if(!p || !p.on) return {st:'off'};
  const last = lastService(v,id);
  const baseKm = last ? last.km : (v.kmInicial ?? null);
  const baseDate = last ? last.date : (v.dataInicial || null);
  let nextKm=null, nextDate=null, kmLeft=null, daysLeft=null, pct=0;
  if(p.km>0 && baseKm!=null){ nextKm = baseKm + p.km; kmLeft = nextKm - v.km; pct=Math.max(pct,(v.km-baseKm)/p.km); }
  if(p.m>0 && baseDate){ nextDate = addMonths(baseDate,p.m); daysLeft = daysBetween(today(), nextDate); const tot=daysBetween(baseDate,nextDate)||1; pct=Math.max(pct,daysBetween(baseDate,today())/tot); }
  let st='ok';
  if(!last) st = 'nunca';
  if((kmLeft!=null && kmLeft<=0) || (daysLeft!=null && daysLeft<=0)) st='bad';
  else if((kmLeft!=null && kmLeft<=WARN_KM) || (daysLeft!=null && daysLeft<=WARN_DAYS)) st='warn';
  return {st,last,nextKm,nextDate,kmLeft,daysLeft,pct:Math.min(1,Math.max(0,pct))};
}
function badge(r){
  if(r.st==='off') return '<span class="badge b-off">Desativado</span>';
  if(r.st==='bad') return '<span class="badge b-bad">Vencido</span>';
  if(r.st==='warn') return '<span class="badge b-warn">Em breve</span>';
  if(r.st==='nunca') return '<span class="badge b-off">Sem registro</span>';
  return '<span class="badge b-ok">Em dia</span>';
}
function dueText(r){
  const parts=[];
  if(r.nextKm!=null) parts.push(r.kmLeft<=0 ? `passou ${fmtKm(-r.kmLeft)}` : `faltam ${fmtKm(r.kmLeft)} (em ${fmtKm(r.nextKm)})`);
  if(r.nextDate) parts.push(r.daysLeft<=0 ? `venceu há ${-r.daysLeft} dia(s)` : `até ${fmtDate(r.nextDate)} (${r.daysLeft} dias)`);
  return parts.join(' · ') || 'sem intervalo definido';
}

/* ===== Render ===== */
function render(){
  const sel = document.getElementById('vehSel');
  sel.innerHTML = S.vehicles.length ? S.vehicles.map(v=>`<option value="${v.id}" ${v.id===S.current?'selected':''}>${esc(showPlate(v.placa))} — ${esc(v.modelo||'')}</option>`).join('') : '<option>Nenhum veículo</option>';
  sel.style.display = S.vehicles.length ? '' : 'none';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  const v = veh();
  if(!v && !['veiculos','dados'].includes(tab)) tab='veiculos';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  const view = document.getElementById('view');
  view.innerHTML = ({painel:vPainel, registrar:vRegistrar, historico:vHistorico, plano:vPlano, veiculos:vVeiculos, dados:vDados})[tab](v);
  bind(tab, v);
}

function vPainel(v){
  const items = allItems(v).map(id=>({id, r:status(v,id)})).filter(x=>x.r.st!=='off');
  const cnt = st => items.filter(x=>x.r.st===st).length;
  const gasto = (v.services||[]).reduce((a,s)=>a+(+s.custo||0),0);
  const anoAtual = new Date().getFullYear().toString();
  const gastoAno = (v.services||[]).filter(s=>s.date.startsWith(anoAtual)).reduce((a,s)=>a+(+s.custo||0),0);
  const order = {bad:0,warn:1,nunca:2,ok:3};
  let html = `
  <div class="card row" style="justify-content:space-between">
    <div class="row">${plateHTML(v.placa)}<div><div style="font-weight:700">${esc(v.modelo||'')}</div><div class="muted">${esc([v.marca,v.ano,v.combustivel].filter(Boolean).join(' · '))}</div></div></div>
    <form class="kmbar" id="kmForm"><span class="muted">Km atual</span><input type="number" min="0" id="kmNow" value="${v.km}" inputmode="numeric"><button class="btn pri">Atualizar km</button></form>
  </div>
  <div class="kpis">
    <div class="kpi bad"><div class="v">${cnt('bad')}</div><div class="l">Vencidos</div></div>
    <div class="kpi warn"><div class="v">${cnt('warn')}</div><div class="l">Vencem em breve</div></div>
    <div class="kpi ok"><div class="v">${cnt('ok')}</div><div class="l">Em dia</div></div>
    <div class="kpi"><div class="v">${cnt('nunca')}</div><div class="l">Sem registro</div></div>
    <div class="kpi"><div class="v" style="font-size:18px">${fmtMoney(gastoAno)}</div><div class="l">Gasto em ${anoAtual} · total ${fmtMoney(gasto)}</div></div>
  </div>`;
  const urgent = items.filter(x=>x.r.st==='bad'||x.r.st==='warn').sort((a,b)=>order[a.r.st]-order[b.r.st]);
  if(urgent.length){
    html += `<div class="card"><h2>⚠️ Atenção agora</h2>${urgent.map(x=>itemRow(v,x)).join('')}</div>`;
  }
  CATS.forEach(cat=>{
    const list = items.filter(x=>itemCat(x.id,v)===cat).sort((a,b)=>order[a.r.st]-order[b.r.st]);
    if(!list.length) return;
    html += `<div class="card"><h3>${CAT_ICON[cat]||''} ${cat}</h3>${list.map(x=>itemRow(v,x)).join('')}</div>`;
  });
  return html;
}
function itemRow(v,{id,r}){
  const color = r.st==='bad'?'var(--bad)':r.st==='warn'?'var(--warn)':'var(--ok)';
  const lastTxt = r.last ? `Último: ${fmtDate(r.last.date)} com ${fmtKm(r.last.km)}` : 'Nenhum serviço registrado';
  return `<div class="item">
    <div class="name">${esc(itemName(id,v))}</div>
    <div class="act">${badge(r)}<button class="btn sm" data-quick="${id}" title="Registrar como feito hoje">✓ Feito</button></div>
    <div class="meta">${lastTxt} · ${dueText(r)}</div>
    ${r.st!=='nunca'?`<div class="progress"><i style="width:${Math.round(r.pct*100)}%;background:${color}"></i></div>`:''}
  </div>`;
}

function vRegistrar(v, pre){
  const preset = pre || [];
  let checks='';
  CATS.forEach(cat=>{
    const ids = allItems(v).filter(id=>itemCat(id,v)===cat);
    if(!ids.length) return;
    checks += `<div class="cat">${CAT_ICON[cat]||''} ${cat}</div>` + ids.map(id=>`<label><input type="checkbox" name="it" value="${id}" ${preset.includes(id)?'checked':''}> ${esc(itemName(id,v))}</label>`).join('');
  });
  return `<form class="card" id="svcForm">
    <h2>Registrar serviço — ${esc(showPlate(v.placa))}</h2>
    <div class="grid">
      <label class="f">Data<input type="date" name="date" value="${today()}" required></label>
      <label class="f">Quilometragem<input type="number" name="km" min="0" value="${v.km}" required inputmode="numeric"></label>
      <label class="f">Custo total (R$)<input type="number" name="custo" min="0" step="0.01" placeholder="0,00" inputmode="decimal"></label>
      <label class="f">Oficina / local<input name="oficina" placeholder="Ex.: Auto Center Silva"></label>
    </div>
    <p class="muted" style="margin:14px 0 6px">Itens realizados (marque todos):</p>
    <div class="checks">${checks}</div>
    <div class="grid" style="margin-top:12px">
      <label class="f">Peças / marcas usadas<input name="pecas" placeholder="Ex.: Óleo 5W30 sintético, filtro Tecfil"></label>
      <label class="f">Observações<input name="obs" placeholder="Ex.: pneu dianteiro esquerdo com desgaste"></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn pri">Salvar serviço</button><span class="muted">A km atual do veículo é atualizada se for maior.</span></div>
  </form>`;
}

function vHistorico(v){
  let list = [...(v.services||[])].sort((a,b)=> b.date.localeCompare(a.date) || b.km-a.km);
  if(histFilter) list = list.filter(s=>s.items.some(id=>itemCat(id,v)===histFilter));
  const total = list.reduce((a,s)=>a+(+s.custo||0),0);
  const opts = ['<option value="">Todas as categorias</option>', ...CATS.map(c=>`<option ${c===histFilter?'selected':''}>${c}</option>`)].join('');
  if(!(v.services||[]).length) return `<div class="card empty">Nenhum serviço registrado ainda.<br><br><button class="btn pri" data-go="registrar">Registrar o primeiro</button></div>`;
  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Histórico — ${list.length} serviço(s) · ${fmtMoney(total)}</h2>
    <select id="histCat" class="veh">${opts}</select></div>
    <div class="tbl"><table>
      <thead><tr><th>Data</th><th class="num">Km</th><th>Serviços</th><th class="hide-sm">Oficina / obs.</th><th class="num">Custo</th><th></th></tr></thead>
      <tbody>${list.map(s=>`<tr>
        <td>${fmtDate(s.date)}</td><td class="num">${fmtKm(s.km)}</td>
        <td>${s.items.map(id=>esc(itemName(id,v))).join(', ')}${s.pecas?`<div class="muted">${esc(s.pecas)}</div>`:''}</td>
        <td class="hide-sm">${esc(s.oficina||'')}${s.obs?`<div class="muted">${esc(s.obs)}</div>`:''}</td>
        <td class="num">${s.custo?fmtMoney(s.custo):'—'}</td>
        <td><button class="btn sm danger" data-del="${s.id}" title="Excluir">✕</button></td></tr>`).join('')}</tbody>
    </table></div></div>`;
}

function vPlano(v){
  let html = `<div class="card"><h2>Plano de manutenção — ${esc(showPlate(v.placa))}</h2>
    <p class="muted" style="margin-top:0">Ajuste os intervalos conforme o manual do seu carro. Use 0 para ignorar km ou meses. O item vence no que ocorrer primeiro. Desmarque o que não se aplica (ex.: câmbio automático, sem A/C).</p>
    <div class="plan-row" style="font-size:12px;color:var(--soft);border-top:0"><span></span><span>Item</span><span>A cada km</span><span>A cada meses</span></div>`;
  CATS.forEach(cat=>{
    const ids = allItems(v).filter(id=>itemCat(id,v)===cat);
    if(!ids.length) return;
    html += `<div style="margin-top:10px;font-weight:700;font-size:13px">${CAT_ICON[cat]||''} ${cat}</div>`;
    html += ids.map(id=>{ const p=v.plan[id]||{on:true,km:0,m:0}; return `<div class="plan-row" data-id="${id}">
      <input type="checkbox" class="p-on" ${p.on?'checked':''} aria-label="Ativo">
      <span>${esc(itemName(id,v))}${v.custom&&v.custom[id]?` <button class="btn sm danger" data-delcustom="${id}">remover</button>`:''}</span>
      <input type="number" min="0" step="500" class="p-km" value="${p.km}">
      <input type="number" min="0" class="p-m" value="${p.m}"></div>`; }).join('');
  });
  html += `<div class="row" style="margin-top:14px"><button class="btn pri" id="savePlan">Salvar plano</button><button class="btn" id="resetPlan">Restaurar padrão</button></div></div>
  <form class="card" id="customForm"><h2>Adicionar item personalizado</h2>
    <div class="grid">
      <label class="f">Nome<input name="name" required placeholder="Ex.: Filtro de óleo do câmbio"></label>
      <label class="f">Categoria<select name="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="f">A cada km<input type="number" name="km" min="0" value="0"></label>
      <label class="f">A cada meses<input type="number" name="m" min="0" value="12"></label>
    </div><div style="margin-top:12px"><button class="btn pri">Adicionar</button></div></form>`;
  return html;
}

function vVeiculos(v){
  const list = S.vehicles.map(x=>`<div class="item">
    <div class="name row">${plateHTML(x.placa,true)} <span>${esc(x.modelo||'')} ${x.ano?`<span class="muted">(${esc(x.ano)})</span>`:''}</span></div>
    <div class="act"><button class="btn sm" data-sel="${x.id}">${x.id===S.current?'Selecionado':'Selecionar'}</button><button class="btn sm" data-edit="${x.id}">Editar</button><button class="btn sm danger" data-delveh="${x.id}">Excluir</button></div>
    <div class="meta">${fmtKm(x.km)} · ${(x.services||[]).length} serviço(s)</div></div>`).join('');
  return `${S.vehicles.length?`<div class="card"><h2>Meus veículos</h2>${list}</div>`:''}
  ${vehForm()}`;
}
function vehForm(x){
  x = x || {};
  return `<form class="card" id="vehForm"><input type="hidden" name="id" value="${x.id||''}">
    <h2>${x.id?'Editar veículo':'Cadastrar veículo'}</h2>
    <div class="row" style="margin-bottom:12px">${plateHTML(x.placa||'ABC1D23')}<span class="muted" id="plateMsg">Padrão Mercosul (ABC1D23) ou antigo (ABC-1234)</span></div>
    <div class="grid">
      <label class="f">Placa *<input name="placa" required maxlength="8" value="${esc(showPlate(x.placa||''))}" placeholder="ABC1D23" style="text-transform:uppercase" autocomplete="off"></label>
      <label class="f">Marca<input name="marca" value="${esc(x.marca||'')}" placeholder="Ex.: Volkswagen"></label>
      <label class="f">Modelo *<input name="modelo" required value="${esc(x.modelo||'')}" placeholder="Ex.: Gol 1.0"></label>
      <label class="f">Ano<input name="ano" value="${esc(x.ano||'')}" placeholder="2020/2021"></label>
      <label class="f">Combustível<select name="combustivel">${['Flex','Gasolina','Etanol','Diesel','GNV','Híbrido','Elétrico'].map(c=>`<option ${x.combustivel===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label class="f">Cor<input name="cor" value="${esc(x.cor||'')}"></label>
      <label class="f">Km atual *<input type="number" name="km" min="0" required value="${x.km??''}" inputmode="numeric"></label>
      <label class="f">Renavam / chassi<input name="doc" value="${esc(x.doc||'')}"></label>
      <label class="f">Medida dos pneus<input name="pneu" value="${esc(x.pneu||'')}" placeholder="Ex.: 175/70 R14"></label>
      <label class="f">Óleo recomendado<input name="oleoTipo" value="${esc(x.oleoTipo||'')}" placeholder="Ex.: 5W30 sintético, 3,5 L"></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn pri">${x.id?'Salvar alterações':'Cadastrar'}</button>${x.id?'<button type="button" class="btn" data-go="veiculos">Cancelar</button>':''}</div>
  </form>`;
}

function vDados(){
  return `<div class="card"><h2>Backup dos dados</h2>
    <p class="muted">Os dados ficam salvos apenas neste navegador/aparelho. Exporte um backup para guardar ou levar para outro aparelho.</p>
    <div class="row"><button class="btn pri" id="exp">⬇️ Exportar backup (JSON)</button><button class="btn" id="expCsv">⬇️ Exportar histórico (CSV)</button>
    <label class="btn">⬆️ Importar backup<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>
    <div class="card"><h2>Dicas de boa manutenção</h2><ul class="muted" style="margin:0;padding-left:18px">
      <li>Atualize a quilometragem toda semana (ou a cada abastecimento) para os alertas ficarem certos.</li>
      <li>Calibre os pneus a frio, incluindo o estepe, a cada 15 dias.</li>
      <li>Uso severo (trânsito urbano, poeira, viagens curtas) pede intervalos menores — ajuste no Plano.</li>
      <li>Correia dentada rompida pode destruir o motor: não passe do prazo.</li>
      <li>Fluido de freio absorve umidade; troque mesmo com pouca quilometragem.</li>
      <li>Guarde notas fiscais — registrar oficina e peças ajuda na garantia e na revenda.</li>
    </ul></div>`;
}

/* ===== Eventos ===== */
function bind(t, v){
  const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
  $$('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go; render();});
  if(t==='painel'){
    $('#kmForm').onsubmit = e=>{ e.preventDefault(); const k=+$('#kmNow').value; if(k<v.km && !confirm('A km informada é menor que a atual. Confirmar?')) return; v.km=k; save(); render(); toast('Quilometragem atualizada'); };
    $$('[data-quick]').forEach(b=>b.onclick=()=>{ tab='registrar'; document.getElementById('view').innerHTML=vRegistrar(v,[b.dataset.quick]); bind('registrar',v); document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='registrar')); window.scrollTo(0,0); });
  }
  if(t==='registrar'){
    $('#svcForm').onsubmit = e=>{
      e.preventDefault(); const f=new FormData(e.target);
      const items = f.getAll('it'); if(!items.length) return toast('Marque pelo menos um item');
      const s = {id:uid(), date:f.get('date'), km:+f.get('km'), custo:+f.get('custo')||0, oficina:f.get('oficina').trim(), pecas:f.get('pecas').trim(), obs:f.get('obs').trim(), items};
      v.services = v.services||[]; v.services.push(s);
      if(s.km>v.km) v.km=s.km;
      save(); tab='painel'; render(); window.scrollTo(0,0); toast('Serviço registrado');
    };
  }
  if(t==='historico'){
    const hc=$('#histCat'); if(hc) hc.onchange=()=>{histFilter=hc.value; render();};
    $$('[data-del]').forEach(b=>b.onclick=()=>{ if(!confirm('Excluir este registro?')) return; v.services=v.services.filter(s=>s.id!==b.dataset.del); save(); render(); });
  }
  if(t==='plano'){
    $('#savePlan').onclick=()=>{ $$('.plan-row[data-id]').forEach(r=>{ v.plan[r.dataset.id]={on:r.querySelector('.p-on').checked, km:+r.querySelector('.p-km').value||0, m:+r.querySelector('.p-m').value||0}; }); save(); toast('Plano salvo'); };
    $('#resetPlan').onclick=()=>{ if(!confirm('Restaurar intervalos padrão?')) return; const d=defaultPlan(); Object.keys(d).forEach(k=>v.plan[k]=d[k]); save(); render(); toast('Plano restaurado'); };
    $$('[data-delcustom]').forEach(b=>b.onclick=()=>{ if(!confirm('Remover item personalizado?')) return; delete v.custom[b.dataset.delcustom]; delete v.plan[b.dataset.delcustom]; save(); render(); });
    $('#customForm').onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target); const id='c_'+uid(); v.custom=v.custom||{}; v.custom[id]={name:f.get('name').trim(),cat:f.get('cat')}; v.plan[id]={on:true,km:+f.get('km')||0,m:+f.get('m')||0}; save(); render(); toast('Item adicionado'); };
  }
  if(t==='veiculos'){
    bindVehForm();
    $$('[data-sel]').forEach(b=>b.onclick=()=>{ S.current=b.dataset.sel; save(); tab='painel'; render(); });
    $$('[data-edit]').forEach(b=>b.onclick=()=>{ const x=S.vehicles.find(y=>y.id===b.dataset.edit); document.getElementById('vehForm').outerHTML=vehForm(x); bindVehForm(); document.getElementById('vehForm').scrollIntoView({behavior:'smooth'}); });
    $$('[data-delveh]').forEach(b=>b.onclick=()=>{ const x=S.vehicles.find(y=>y.id===b.dataset.delveh); if(!confirm(`Excluir o veículo ${showPlate(x.placa)} e todo o histórico?`)) return; S.vehicles=S.vehicles.filter(y=>y.id!==x.id); if(S.current===x.id) S.current=S.vehicles[0]?.id||null; save(); render(); });
  }
  if(t==='dados'){
    $('#exp').onclick=()=>download(`manutencao-backup-${today()}.json`, JSON.stringify(S,null,2),'application/json');
    $('#expCsv').onclick=()=>{
      const rows=[['Placa','Modelo','Data','Km','Itens','Custo','Oficina','Peças','Observações']];
      S.vehicles.forEach(x=>(x.services||[]).forEach(s=>rows.push([showPlate(x.placa),x.modelo,s.date,s.km,s.items.map(id=>itemName(id,x)).join(' | '),String(s.custo||0).replace('.',','),s.oficina,s.pecas,s.obs])));
      download(`manutencao-historico-${today()}.csv`, '﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');
    };
    $('#imp').onchange=e=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.vehicles) throw 0; if(!confirm('Substituir todos os dados atuais pelo backup?')) return; S=d; save(); tab='painel'; render(); toast('Backup importado'); }catch(err){ toast('Arquivo inválido'); } }; rd.readAsText(file); };
  }
}
function bindVehForm(){
  const form=document.getElementById('vehForm'); const pi=form.placa; const msg=document.getElementById('plateMsg');
  pi.oninput=()=>{ const p=normPlate(pi.value); form.querySelector('.plate .num').textContent=showPlate(p)||'ABC1D23'; msg.textContent = p.length===7 ? (validPlate(p)?'✓ Placa válida':'Formato inválido') : 'Padrão Mercosul (ABC1D23) ou antigo (ABC-1234)'; msg.style.color = p.length===7 && !validPlate(p) ? 'var(--bad)' : ''; };
  form.onsubmit=e=>{
    e.preventDefault(); const f=new FormData(form); const placa=normPlate(f.get('placa'));
    if(!validPlate(placa)) return toast('Placa inválida. Use ABC1D23 ou ABC-1234');
    const id=f.get('id');
    if(S.vehicles.some(x=>x.placa===placa && x.id!==id)) return toast('Já existe um veículo com essa placa');
    const data={placa, marca:f.get('marca').trim(), modelo:f.get('modelo').trim(), ano:f.get('ano').trim(), combustivel:f.get('combustivel'), cor:f.get('cor').trim(), km:+f.get('km'), doc:f.get('doc').trim(), pneu:f.get('pneu').trim(), oleoTipo:f.get('oleoTipo').trim()};
    if(id){ Object.assign(S.vehicles.find(x=>x.id===id), data); toast('Veículo atualizado'); }
    else { const nv={id:uid(), ...data, kmInicial:data.km, dataInicial:today(), plan:defaultPlan(), custom:{}, services:[]}; S.vehicles.push(nv); S.current=nv.id; tab='painel'; toast('Veículo cadastrado'); }
    save(); render();
  };
}
function download(name, content, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

document.getElementById('tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; if(!veh() && !['veiculos','dados'].includes(b.dataset.t)) return toast('Cadastre um veículo primeiro'); tab=b.dataset.t; render(); };
document.getElementById('vehSel').onchange=e=>{ S.current=e.target.value; save(); render(); };
render();
</script>
</body>
</html>
