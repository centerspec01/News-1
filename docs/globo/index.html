<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globo ao Vivo</title>
<meta name="description" content="Globo 3D com as principais cidades do mundo: horário local, temperatura e notícias atualizadas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03060d;
    --panel: rgba(10, 16, 30, .82);
    --panel-solid: #0a101e;
    --line: rgba(148, 180, 255, .16);
    --text: #e8eefc;
    --muted: #8b9bbd;
    --accent: #5fb4ff;
    --hot: #ff6b4a;
    --cold: #4aa8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #globe { position: fixed; inset: 0; }
  button { font: inherit; color: inherit; }

  /* Header */
  .top { position: fixed; top: 16px; left: 16px; width: 300px; display: flex; flex-direction: column; gap: 10px; align-items: stretch;
    pointer-events: none; z-index: 5; }
  .brand, .search { pointer-events: auto; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 14px; }
  .brand { padding: 12px 16px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.6);
    animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
  .status { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .search { position: relative; }
  .search input { width: 100%; background: transparent; border: 0; outline: 0; color: var(--text);
    padding: 12px 14px; font: inherit; font-size: 14px; }
  .search input::placeholder { color: var(--muted); }
  .results { display: none; max-height: 52vh; overflow: auto; border-top: 1px solid var(--line); }
  .search.open .results { display: block; }
  .results button { display: flex; width: 100%; justify-content: space-between; gap: 8px; background: none; border: 0;
    padding: 9px 14px; cursor: pointer; text-align: left; font-size: 13px; }
  .results button:hover, .results button.sel { background: rgba(95,180,255,.12); }
  .results small { color: var(--muted); font-variant-numeric: tabular-nums; }

  .controls { position: fixed; left: 16px; bottom: 64px; display: flex; gap: 8px; z-index: 5; }
  .controls button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 12px; cursor: pointer; backdrop-filter: blur(12px); }
  .controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* City chips on the globe */
  .chip { pointer-events: auto; cursor: pointer; transform: translate(-6px, -50%); display: flex; align-items: center; gap: 6px;
    white-space: nowrap; font-size: 11px; line-height: 1.15; transition: opacity .25s; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); flex: none;
    box-shadow: 0 0 10px currentColor; background: currentColor; }
  .chip .lbl { background: rgba(5,10,22,.72); border: 1px solid rgba(255,255,255,.12); padding: 3px 7px; border-radius: 7px;
    display: flex; flex-direction: column; }
  .chip b { font-weight: 600; }
  .chip .t { font-weight: 700; }
  .chip .h { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .chip:hover, .chip.active { z-index: 10; }
  .chip:hover .lbl, .chip.active .lbl { border-color: var(--accent); background: rgba(10,30,60,.9); }
  .compact .chip .lbl .h { display: none; }

  /* Side panel */
  .panel { position: fixed; top: 16px; right: 16px; bottom: 64px; width: 380px; z-index: 6; background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 24px));
    transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .panel.open { transform: none; }
  .panel header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255,255,255,.04); cursor: pointer; font-size: 16px; }
  .country { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .panel h2 { margin: 2px 0 10px; font-size: 26px; }
  .clock { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .date { font-size: 13px; color: var(--muted); }
  .wx { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; margin-top: 14px; }
  .wx .icon { font-size: 38px; grid-row: span 2; }
  .wx .temp { font-size: 28px; font-weight: 700; }
  .wx .desc { font-size: 13px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .stats div { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; }
  .stats small { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stats span { font-size: 13px; font-weight: 600; }
  .news { flex: 1; overflow: auto; padding: 6px 12px 16px; }
  .news h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 12px 8px 6px; }
  .news a { display: block; text-decoration: none; color: var(--text); padding: 10px 8px; border-radius: 10px; }
  .news a:hover { background: rgba(95,180,255,.08); }
  .news a + a { border-top: 1px solid var(--line); }
  .news .ttl { font-size: 14px; line-height: 1.35; font-weight: 500; }
  .news .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 8px; }

  /* Ticker */
  .ticker { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; z-index: 5; background: rgba(5,9,18,.88);
    border-top: 1px solid var(--line); display: flex; align-items: center; overflow: hidden; }
  .ticker .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 14px; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; background: #c8102e; color: #fff; position: relative; z-index: 1; }
  .track { display: flex; gap: 36px; white-space: nowrap; padding-left: 24px; animation: scroll 240s linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .track button { background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0; }
  .track button b { color: var(--accent); margin-right: 6px; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  .legend { position: fixed; left: 16px; bottom: 104px; z-index: 5; font-size: 11px; color: var(--muted); }
  .legend .bar { width: 160px; height: 6px; border-radius: 3px; margin: 4px 0 2px;
    background: linear-gradient(90deg, #6a5cff, #4aa8ff, #3ddcb0, #ffd84a, #ff9a3c, #ff4a4a); }
  .legend .sc { display: flex; justify-content: space-between; width: 160px; }

  @media (max-width: 720px) {
    .top { right: 16px; width: auto; }
    .panel { top: auto; left: 8px; right: 8px; bottom: 52px; width: auto; height: 62vh; transform: translateY(calc(100% + 60px)); }
    .controls { bottom: 56px; }
    .legend { display: none; }
    .clock { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="globe"></div>

<div class="top">
  <div class="brand">
    <h1><span class="live"></span>Globo ao Vivo</h1>
    <div class="status" id="status">Carregando dados…</div>
  </div>
  <div class="search" id="search">
    <input id="q" type="search" placeholder="Buscar cidade…" autocomplete="off" aria-label="Buscar cidade">
    <div class="results" id="results"></div>
  </div>
</div>

<div class="legend">
  Temperatura atual
  <div class="bar"></div>
  <div class="sc"><span>-10°</span><span>10°</span><span>25°</span><span>40°</span></div>
</div>

<div class="controls">
  <button id="rotate" aria-pressed="true">⟳ Girar</button>
  <button id="labels" aria-pressed="true">🕒 Horários</button>
  <button id="home">⌂ Visão geral</button>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <header>
    <button class="close" id="close" aria-label="Fechar">✕</button>
    <div class="country" id="pCountry"></div>
    <h2 id="pName"></h2>
    <div class="clock" id="pClock">--:--:--</div>
    <div class="date" id="pDate"></div>
    <div class="wx">
      <div class="icon" id="pIcon">·</div>
      <div class="temp" id="pTemp">--°</div>
      <div class="desc" id="pDesc"></div>
    </div>
    <div class="stats">
      <div><small>Sensação</small><span id="pFeels">--</span></div>
      <div><small>Mín/Máx</small><span id="pMinMax">--</span></div>
      <div><small>Umidade</small><span id="pHum">--</span></div>
      <div><small>Vento</small><span id="pWind">--</span></div>
    </div>
  </header>
  <div class="news" id="pNews"></div>
</aside>

<div class="ticker">
  <div class="tag">ÚLTIMAS</div>
  <div class="track" id="track"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.45.3/dist/globe.gl.min.js"></script>
<script>
(() => {
  const IMG = "https://cdn.jsdelivr.net/npm/three-globe@2.45.0/example/img/";
  const NEWS_URLS = ["news.json", "https://raw.githubusercontent.com/centerspec01/News-1/main/docs/globo/news.json"];
  const WEATHER_EVERY = 10 * 60e3, NEWS_EVERY = 5 * 60e3;

  const $ = (id) => document.getElementById(id);
  let cities = [], weather = {}, news = { cities: {} }, selected = null, weatherAt = null;

  const WMO = {
    0: ["☀️", "Céu limpo"], 1: ["🌤️", "Predomínio de sol"], 2: ["⛅", "Parcialmente nublado"], 3: ["☁️", "Nublado"],
    45: ["🌫️", "Neblina"], 48: ["🌫️", "Névoa com geada"], 51: ["🌦️", "Garoa fraca"], 53: ["🌦️", "Garoa"], 55: ["🌧️", "Garoa forte"],
    56: ["🌧️", "Garoa congelante"], 57: ["🌧️", "Garoa congelante"], 61: ["🌧️", "Chuva fraca"], 63: ["🌧️", "Chuva"],
    65: ["🌧️", "Chuva forte"], 66: ["🌧️", "Chuva congelante"], 67: ["🌧️", "Chuva congelante"], 71: ["🌨️", "Neve fraca"],
    73: ["🌨️", "Neve"], 75: ["❄️", "Neve forte"], 77: ["🌨️", "Grãos de neve"], 80: ["🌦️", "Pancadas de chuva"],
    81: ["🌧️", "Pancadas de chuva"], 82: ["⛈️", "Pancadas fortes"], 85: ["🌨️", "Pancadas de neve"], 86: ["❄️", "Pancadas de neve"],
    95: ["⛈️", "Trovoadas"], 96: ["⛈️", "Trovoadas com granizo"], 99: ["⛈️", "Trovoadas com granizo"]
  };
  const wmo = (c, day) => {
    const [i, d] = WMO[c] || ["·", "—"];
    return [day === 0 && (c === 0 || c === 1) ? "🌙" : i, d];
  };

  const STOPS = [[-10, [106, 92, 255]], [5, [74, 168, 255]], [15, [61, 220, 176]], [24, [255, 216, 74]], [31, [255, 154, 60]], [40, [255, 74, 74]]];
  function tempColor(t) {
    if (t == null) return "#8b9bbd";
    if (t <= STOPS[0][0]) return `rgb(${STOPS[0][1]})`;
    for (let i = 1; i < STOPS.length; i++) {
      const [t1, c1] = STOPS[i], [t0, c0] = STOPS[i - 1];
      if (t <= t1) {
        const k = (t - t0) / (t1 - t0);
        return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k))})`;
      }
    }
    return `rgb(${STOPS.at(-1)[1]})`;
  }

  const fmtCache = {};
  const fmt = (tz, opts) => (fmtCache[tz + JSON.stringify(opts)] ||= new Intl.DateTimeFormat("pt-BR", { timeZone: tz, ...opts }));
  const timeIn = (tz, sec) => fmt(tz, { hour: "2-digit", minute: "2-digit", ...(sec ? { second: "2-digit" } : {}) }).format(new Date());
  const dateIn = (tz) => fmt(tz, { weekday: "long", day: "numeric", month: "long" }).format(new Date());
  function offsetLabel(tz) {
    const p = fmt(tz, { timeZoneName: "shortOffset" }).formatToParts(new Date()).find((x) => x.type === "timeZoneName");
    return p ? p.value.replace("GMT", "UTC") : "";
  }
  function ago(iso) {
    const m = Math.round((Date.now() - new Date(iso)) / 60e3);
    if (!isFinite(m)) return "";
    if (m < 1) return "agora";
    if (m < 60) return `há ${m} min`;
    const h = Math.round(m / 60);
    return h < 24 ? `há ${h} h` : `há ${Math.round(h / 24)} d`;
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : "#");

  // ---------- Globe ----------
  const globe = Globe()($("globe"))
    .globeImageUrl(IMG + "earth-blue-marble.jpg")
    .bumpImageUrl(IMG + "earth-topology.png")
    .backgroundImageUrl(IMG + "night-sky.png")
    .atmosphereColor("#5fb4ff")
    .atmosphereAltitude(0.18)
    .htmlLat("lat").htmlLng("lon").htmlAltitude(0.01)
    .htmlElement((c) => c.el)
    .ringLat("lat").ringLng("lon")
    .ringColor(() => (t) => `rgba(95,180,255,${1 - t})`)
    .ringMaxRadius(4).ringPropagationSpeed(2.5).ringRepeatPeriod(900);
  if (globe.htmlElementVisibilityModifier) globe.htmlElementVisibilityModifier((el, v) => { el.style.opacity = v ? 1 : 0; el.style.pointerEvents = v ? "auto" : "none"; });

  const controls = globe.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.minDistance = 130;
  controls.maxDistance = 700;
  globe.pointOfView({ lat: 10, lng: -30, altitude: 2.4 });
  const resize = () => globe.width(innerWidth).height(innerHeight);
  addEventListener("resize", resize); resize();

  function buildChip(c) {
    const el = document.createElement("div");
    el.className = "chip";
    el.innerHTML = `<span class="dot"></span><span class="lbl"><span><b>${esc(c.name)}</b> <span class="t">--°</span></span><span class="h"></span></span>`;
    el.addEventListener("click", (e) => { e.stopPropagation(); select(c); });
    c.el = el;
    c.elT = el.querySelector(".t");
    c.elH = el.querySelector(".h");
    c.elDot = el.querySelector(".dot");
  }
  function paintChips() {
    for (const c of cities) {
      const w = weather[c.id];
      const t = w ? Math.round(w.current.temperature_2m) : null;
      c.elT.textContent = t == null ? "--°" : `${t}°`;
      c.elDot.style.color = tempColor(t);
      c.elH.textContent = timeIn(c.tz);
      c.el.classList.toggle("active", selected === c);
    }
  }

  // ---------- Data ----------
  async function loadWeather() {
    const p = new URLSearchParams({
      latitude: cities.map((c) => c.lat).join(","),
      longitude: cities.map((c) => c.lon).join(","),
      current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day",
      daily: "temperature_2m_max,temperature_2m_min",
      forecast_days: "1",
      timezone: "auto"
    });
    try {
      const r = await fetch("https://api.open-meteo.com/v1/forecast?" + p);
      if (!r.ok) throw new Error(r.status);
      let data = await r.json();
      if (!Array.isArray(data)) data = [data];
      data.forEach((d, i) => cities[i] && (weather[cities[i].id] = d));
      weatherAt = new Date();
    } catch (e) { console.warn("Clima indisponível", e); }
    paintChips(); updateStatus(); if (selected) renderPanel();
  }

  async function loadNews() {
    for (const url of NEWS_URLS) {
      try {
        const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) continue;
        const j = await r.json();
        if (j && j.cities) { news = j; break; }
      } catch {}
    }
    renderTicker(); updateStatus(); if (selected) renderPanel();
  }

  function updateStatus() {
    const parts = [];
    parts.push(weatherAt ? `Clima: ${weatherAt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}` : "Clima: aguardando");
    parts.push(news.updated ? `Notícias: ${ago(news.updated)}` : "Notícias: aguardando 1ª coleta");
    $("status").textContent = `${cities.length} cidades · ${parts.join(" · ")}`;
  }

  // ---------- Panel ----------
  function select(c) {
    selected = c;
    controls.autoRotate = false; $("rotate").setAttribute("aria-pressed", "false");
    globe.pointOfView({ lat: c.lat - (innerWidth < 720 ? 18 : 0), lng: c.lon + (innerWidth < 720 ? 0 : 18), altitude: 1.5 }, 1200);
    globe.ringsData([c]);
    $("panel").classList.add("open");
    renderPanel(); paintChips();
    closeSearch();
  }
  function deselect() {
    selected = null; globe.ringsData([]);
    $("panel").classList.remove("open"); paintChips();
  }
  function renderPanel() {
    const c = selected; if (!c) return;
    $("pCountry").textContent = `${c.country} · ${offsetLabel(c.tz)}`;
    $("pName").textContent = c.name;
    tickClock();
    const w = weather[c.id];
    if (w) {
      const cu = w.current, [icon, desc] = wmo(cu.weather_code, cu.is_day);
      $("pIcon").textContent = icon;
      $("pTemp").textContent = `${Math.round(cu.temperature_2m)}°C`;
      $("pTemp").style.color = tempColor(cu.temperature_2m);
      $("pDesc").textContent = desc;
      $("pFeels").textContent = `${Math.round(cu.apparent_temperature)}°`;
      $("pMinMax").textContent = w.daily ? `${Math.round(w.daily.temperature_2m_min[0])}° / ${Math.round(w.daily.temperature_2m_max[0])}°` : "--";
      $("pHum").textContent = `${cu.relative_humidity_2m}%`;
      $("pWind").textContent = `${Math.round(cu.wind_speed_10m)} km/h`;
    } else {
      $("pIcon").textContent = "·"; $("pTemp").textContent = "--°"; $("pDesc").textContent = "Clima indisponível";
    }
    const items = news.cities[c.id] || [];
    $("pNews").innerHTML = `<h3>Notícias de ${esc(c.name)}</h3>` + (items.length
      ? items.map((n) => `<a href="${esc(safeUrl(n.link))}" target="_blank" rel="noopener"><div class="ttl">${esc(n.title)}</div><div class="meta">${esc(n.source)}${n.date ? " · " + ago(n.date) : ""}</div></a>`).join("")
      : `<div class="empty">${news.updated ? "Sem notícias recentes para esta cidade." : "As notícias aparecem após a primeira coleta automática (GitHub Actions, a cada 30 min)."}</div>`);
  }
  function tickClock() {
    if (!selected) return;
    $("pClock").textContent = timeIn(selected.tz, true);
    const d = dateIn(selected.tz);
    $("pDate").textContent = d.charAt(0).toUpperCase() + d.slice(1);
  }

  // ---------- Ticker ----------
  function renderTicker() {
    const all = [];
    for (const c of cities) for (const n of (news.cities[c.id] || []).slice(0, 2)) all.push({ c, n });
    all.sort((a, b) => (b.n.date || "").localeCompare(a.n.date || ""));
    const list = all.slice(0, 40);
    if (!list.length) { $("track").innerHTML = `<span style="color:var(--muted);font-size:13px">Clique em uma cidade para ver horário, clima e notícias.</span>`; $("track").style.animation = "none"; return; }
    const html = list.map(({ c, n }) => `<button data-id="${esc(c.id)}"><b>${esc(c.name)}</b>${esc(n.title)}</button>`).join("");
    $("track").innerHTML = html + html; // duplicado para rolagem contínua
    $("track").style.animation = "";
  }
  $("track").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-id]");
    if (b) select(cities.find((c) => c.id === b.dataset.id));
  });

  // ---------- Search ----------
  let hi = 0;
  const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  function renderResults() {
    const q = norm($("q").value.trim());
    const list = cities.filter((c) => !q || norm(c.name + " " + c.country).includes(q));
    hi = Math.min(hi, Math.max(0, list.length - 1));
    $("results").innerHTML = list.map((c, i) => {
      const w = weather[c.id];
      return `<button data-id="${c.id}" class="${i === hi ? "sel" : ""}"><span>${esc(c.name)} <small>${esc(c.country)}</small></span><small>${timeIn(c.tz)} · ${w ? Math.round(w.current.temperature_2m) + "°" : "--"}</small></button>`;
    }).join("") || `<div class="empty" style="padding:10px 14px">Nenhuma cidade</div>`;
    return list;
  }
  function closeSearch() { $("search").classList.remove("open"); $("q").blur(); }
  $("q").addEventListener("focus", () => { $("search").classList.add("open"); renderResults(); });
  $("q").addEventListener("input", () => { hi = 0; renderResults(); });
  $("q").addEventListener("keydown", (e) => {
    const list = renderResults();
    if (e.key === "ArrowDown") { hi = Math.min(hi + 1, list.length - 1); renderResults(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hi = Math.max(hi - 1, 0); renderResults(); e.preventDefault(); }
    else if (e.key === "Enter" && list[hi]) { select(list[hi]); $("q").value = ""; }
    else if (e.key === "Escape") closeSearch();
  });
  $("results").addEventListener("mousedown", (e) => {
    const b = e.target.closest("button[data-id]");
    if (b) { e.preventDefault(); select(cities.find((c) => c.id === b.dataset.id)); $("q").value = ""; }
  });
  document.addEventListener("mousedown", (e) => { if (!$("search").contains(e.target)) $("search").classList.remove("open"); });

  // ---------- Controls ----------
  $("close").onclick = deselect;
  addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) deselect(); });
  $("rotate").onclick = () => {
    controls.autoRotate = !controls.autoRotate;
    $("rotate").setAttribute("aria-pressed", controls.autoRotate);
  };
  $("labels").onclick = () => {
    const on = document.body.classList.toggle("compact");
    $("labels").setAttribute("aria-pressed", !on);
  };
  $("home").onclick = () => {
    deselect(); globe.pointOfView({ lat: 10, lng: -30, altitude: 2.4 }, 1200);
    controls.autoRotate = true; $("rotate").setAttribute("aria-pressed", "true");
  };

  // ---------- Boot ----------
  (async () => {
    cities = await (await fetch("cities.json")).json();
    cities.forEach(buildChip);
    globe.htmlElementsData(cities);
    paintChips();
    await Promise.all([loadWeather(), loadNews()]);
    const id = location.hash.slice(1);
    const c = cities.find((x) => x.id === id);
    if (c) select(c);
  })();

  setInterval(tickClock, 1000);
  setInterval(() => { paintChips(); updateStatus(); }, 15e3);
  setInterval(loadWeather, WEATHER_EVERY);
  setInterval(loadNews, NEWS_EVERY);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && weatherAt && Date.now() - weatherAt > WEATHER_EVERY) { loadWeather(); loadNews(); } });
})();
</script>
</body>
</html>
